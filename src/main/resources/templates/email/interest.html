<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body style="margin:0; padding:0; background-color:#f4f6f8; font-family:Arial, sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center">

            <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff; margin-top:30px; border-radius:10px; overflow:hidden; box-shadow:0 4px 10px rgba(0,0,0,0.05);">

                <tr>
                    <td style="background:#2ecc71; padding:20px; text-align:center; color:white;">
                        <h2 style="margin:0;">🐾 Mojarras</h2>
                        <p style="margin:5px 0 0;">¡Alguien quiere adoptar!</p>
                    </td>
                </tr>

                <tr>
                    <td style="padding:30px; color:#333;">

                        <p>Hola <strong>{{ownerName}}</strong>,</p>

                        <p>
                            🎉 El usuario <strong>{{interestedName}}</strong> está interesado en:
                        </p>

                        <h3 style="color:#e67e22; text-align:center;">{{petName}}</h3>

                        <p style="text-align:center;">
                            📧 <a href="mailto:{{interestedEmail}}" style="color:#3498db;">
                            {{interestedEmail}}
                        </a>
                        </p>

                        <p>Contáctalo lo antes posible para continuar con la adopción.</p>

                        <hr style="border:none; border-top:1px solid #eee;">

                        <p style="font-size:12px; color:#888;">
                            ❤️ Gracias por ayudar a encontrar un hogar.
                        </p>

                    </td>
                </tr>

                <tr>
                    <td style="background:#fafafa; padding:15px; text-align:center; font-size:12px; color:#aaa;">
                        © 2025 Mojarras
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>

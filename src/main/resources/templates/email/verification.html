<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body style="margin:0; padding:0; background-color:#f4f6f8; font-family:Arial, sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center">

            <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff; margin-top:30px; border-radius:10px; overflow:hidden;">

                <tr>
                    <td style="background:#3498db; padding:20px; text-align:center; color:white;">
                        <h2>🔐 Verifica tu cuenta</h2>
                    </td>
                </tr>

                <tr>
                    <td style="padding:30px; color:#333;">

                        <p>Hola <strong>{{userName}}</strong>,</p>

                        <p>Gracias por registrarte en Mojarras 🐾</p>

                        <p style="text-align:center;">
                            <a href="{{verificationLink}}"
                               style="background:#2ecc71; color:white; padding:12px 20px; border-radius:5px; text-decoration:none;">
                                Verificar cuenta
                            </a>
                        </p>

                        <p>Si no creaste esta cuenta, ignora este mensaje.</p>

                    </td>
                </tr>

                <tr>
                    <td style="background:#fafafa; padding:15px; text-align:center; font-size:12px; color:#aaa;">
                        © 2025 Mojarras
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
